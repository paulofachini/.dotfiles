name: 🐧 Test Linux Installation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    name: Ubuntu (WSL/Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}

      - name: Prepare dotfiles directory
        run: |
          mkdir -p "$HOME/.dotfiles"
          cp -r ${{ github.workspace }}/. "$HOME/.dotfiles/"

      - name: Run install script
        run: |
          chmod +x "$HOME/.dotfiles/scripts/install.sh"
          "$HOME/.dotfiles/scripts/install.sh"
        env:
          DOCKER_CONTAINER: "true"

      - name: Run test script
        run: |
          chmod +x "$HOME/.dotfiles/scripts/test.sh"
          "$HOME/.dotfiles/scripts/test.sh"

      - name: Validate symlinks
        run: |
          echo "🔗 Validando symlinks..."
          test -L "$HOME/.zshrc"     && echo "✅ .zshrc ok"     || echo "❌ .zshrc ausente"
          test -L "$HOME/.gitconfig" && echo "✅ .gitconfig ok" || echo "❌ .gitconfig ausente"
          echo "✅ Validação concluída"
