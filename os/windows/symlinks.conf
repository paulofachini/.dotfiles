# =====================================================================================
# 🔗 symlinks.windows.conf - Links simbólicos para Windows (Git Bash)
#
# Mapeamento de arquivos do repositório para o diretório home no Windows.
# Usado pelo script restore.sh quando detect_os() retorna "windows".
#
# Formato: <arquivo_no_repo> <destino_no_home>
# Nota: $HOME no Git Bash aponta para C:\Users\<usuario>
#
# Autor: Paulo Luiz Fachini <paulofachini@gmail.com>
# Data: Maio 2026 | Atualizado: Agosto 2026
# Versão: 1.0.0
# Licença: MIT
# =====================================================================================

zsh/.zshrc .zshrc
# O arquivo abaixo é gerado automaticamente após seleção do tema
zsh/.p10k.zsh .p10k.zsh
git/.gitconfig .gitconfig
